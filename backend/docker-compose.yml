# See docker-compose.local.yml in the repository root for why the version
# is pinned: Compose v1 misreads files without one.
version: "3.7"

services:

  backend:

    image: fridge-monitor-api

    build:
      context: .

    container_name: fridge-monitor-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./data:/app/data

    restart: unless-stopped