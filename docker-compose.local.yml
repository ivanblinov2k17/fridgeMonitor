# Runs the whole stack: API, frontend and the database file.
#
#   docker compose -f docker-compose.local.yml up --build
#
# On old Docker (Docker Toolbox on Windows 7, Compose v1) the command is
# docker-compose with a hyphen; everything else is the same.
#
# Open http://<this-machine>:8080 from any computer on the network. The
# frontend proxies the API, so no server address has to be configured and
# nothing but port 8080 needs to be reachable.
#
# The root docker-compose.yml is the Timeweb deploy file and stays
# backend-only, because that platform forbids volumes and proxies only the
# first service.

# Compose v1 reads a file without a version as the legacy v1 format, takes
# "services" for a service name and rejects the ${VAR:-default} substitutions
# below. 3.7 is the newest format Docker 18.06+ and Compose 1.22+ understand;
# Compose v2 ignores the field.
version: "3.7"

services:

  backend:

    # Fixed names, so images built on one machine and carried over with
    # docker save / docker load are picked up instead of rebuilt. Without
    # them Compose v1 and v2 derive different names (fridgemonitor_backend
    # vs fridgemonitor-backend) and neither finds the other's image.
    image: fridge-monitor-api

    build:
      context: ./backend

    ports:
      # Only needed for reaching the API directly, e.g. /docs. The frontend
      # talks to the backend over the compose network, not through this.
      - "8000:8000"

    environment:

      DATABASE_URL: sqlite+aiosqlite:///./data/fridge.db

      POLL_INTERVAL_SECONDS: "5"

      DEFAULT_DEVICES_COUNT: "10"

      # Real sensors by default: this file is what runs at the factory. On a
      # machine without the hardware start it with POLLER=mock.
      POLLER: ${POLLER:-modbus}

      # MKON gateway in front of the MV110 modules.
      MODBUS_HOST: ${MODBUS_HOST:-192.168.1.31}

      # Addresses searched for modules. A module added later within this
      # range is picked up without a restart; widen it if needed.
      MODBUS_UNITS: ${MODBUS_UNITS:-2-16}

      # Requests arrive through the proxy as same-origin, so these matter only
      # when something calls port 8000 directly.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}

    volumes:
      # Keeps the database across container recreates.
      - ./backend/data:/app/data

    restart: unless-stopped

  frontend:

    image: fridge-monitor-ui

    build:
      context: ./fridge-monitor-ui
      args:
        # Empty means same origin. Set API_URL to a full address only to point
        # the frontend at a backend on another host; it is baked into the
        # bundle, so changing it needs --build.
        VITE_API_URL: ${API_URL-}

    ports:
      - "${WEB_PORT:-8080}:80"

    depends_on:
      - backend

    restart: unless-stopped
