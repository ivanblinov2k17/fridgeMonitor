# Runs the whole stack: API, frontend and the database file.
#
#   docker compose -f docker-compose.local.yml up --build
#
# Open http://<this-machine>:8080 from any computer on the network. The
# frontend proxies the API, so no server address has to be configured and
# nothing but port 8080 needs to be reachable.
#
# The root docker-compose.yml is the Timeweb deploy file and stays
# backend-only, because that platform forbids volumes and proxies only the
# first service.

services:

  backend:

    build:
      context: ./backend

    ports:
      # Only needed for reaching the API directly, e.g. /docs. The frontend
      # talks to the backend over the compose network, not through this.
      - "8000:8000"

    environment:

      DATABASE_URL: sqlite+aiosqlite:///./data/fridge.db

      POLL_INTERVAL_SECONDS: "5"

      DEFAULT_DEVICES_COUNT: "10"

      # Requests arrive through the proxy as same-origin, so these matter only
      # when something calls port 8000 directly.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}

    volumes:
      # Keeps the database across container recreates.
      - ./backend/data:/app/data

    restart: unless-stopped

  frontend:

    build:
      context: ./fridge-monitor-ui
      args:
        # Empty means same origin. Set API_URL to a full address only to point
        # the frontend at a backend on another host; it is baked into the
        # bundle, so changing it needs --build.
        VITE_API_URL: ${API_URL-}

    ports:
      - "${WEB_PORT:-8080}:80"

    depends_on:
      - backend

    restart: unless-stopped
