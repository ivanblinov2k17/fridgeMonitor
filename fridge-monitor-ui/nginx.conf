server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving through a variable keeps nginx from
    # caching the backend's address forever, so recreating that container
    # alone does not leave this one proxying to a dead IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Static files are served from here; anything else is the API, so new
    # endpoints need no change to this file.
    location / {
        try_files $uri $uri/ @backend;
    }

    location @backend {
        set $upstream http://backend:8000;

        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Needs the upgrade headers, which a plain proxy_pass does not send.
    location = /ws {
        set $upstream_ws http://backend:8000/ws;

        proxy_pass $upstream_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        # Readings arrive every few seconds; do not drop an idle socket.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
